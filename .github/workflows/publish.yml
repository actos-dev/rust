# Actos — rust SDK'yı crates.io'ya yayınla.
#
# Yalnızca elle tetiklenir (workflow_dispatch). Yayın geri alınamaz; bu
# amaçla tetikleme bilinçli olmalı. CARGO_REGISTRY_TOKEN repo secret'ından
# okunur, log'a asla basılmaz.

name: Publish

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Sadece kuru koşu (package + doğrula, yayınlama)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    name: crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.96
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Kuru koşu (paket içeriğini doğrula)
        run: cargo publish --dry-run
        env:
          CARGO_TERM_COLOR: always

      - name: Gerçek yayın
        if: github.event.inputs.dry_run == 'false'
        run: cargo publish
        env:
          CARGO_TERM_COLOR: always
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}